<!DOCTYPE html>
<!--
==================================================================================
  PORTAL SOCIO — Aeroclub Río Grande
  v1.04 · 2026-11-19 · Pedido de Daniel: "socio" → "usuario" en los textos visibles (no todos
           los usuarios son socios del club; un cliente del facturador puede no ser socio).
           El título visible pasa a "MI CUENTA" (mismo nombre que el botón del turnero). El
           nombre del archivo portal-socio.html no cambia, para no romper links/accesos.
  v1.03 · 2026-11-19 · Pedido de Daniel: que el detalle se entienda sin saber leer la
           numeración del facturador ("a prueba de boludos"), y que no confundan las columnas
           Importe/Pendiente (casi siempre iguales). Columna TIPO deducida de la numeración y
           del signo (tipoMovimiento): B-/A- = FACTURA (o NOTA DE CRÉDITO si es negativa),
           X- = PAGO (recibo), número suelto = PAGO / AJUSTE o CARGO cargado a mano. Un solo
           importe por renglón: "Debe" / "A favor" en el detalle del facturador y "Falta
           pagar" en facturas impagas; el total de la factura se muestra solo si hubo pago
           parcial ("de $X"). Totales: facturas pendientes − pagos sin aplicar = saldo.
  v1.02 · 2026-11-19 · Pedido de Daniel: la lista de comprobantes pendientes era confusa
           (Knorr: 26 renglones, facturas viejas "pendientes" + créditos sueltos en verde).
           Causa: el reporte del facturador trae lo NO aplicado — sobrantes de pagos ("resto
           a favor") que el club no imputó a las facturas posteriores. Ahora la vista
           principal es "Facturas impagas": imputarCreditosFIFO() aplica esos créditos a
           las facturas abiertas empezando por la más antigua (en centavos enteros) y muestra
           solo lo que falta pagar. Es una deducción, no la imputación real del facturador;
           el total siempre coincide. Botón para ver el detalle tal cual figura en el
           facturador (vista anterior). Si sobra crédito se muestra como saldo a favor.
  v1.01 · 2026-11-19 · Pedido de Daniel: "un solo login y dos roles" para los instructores
           que también son socios. Al entrar como instructor y elegir rol piloto, la
           sesión de Auth es la del instructor (user@instructores...); ahora se busca
           /cc_alias/{emailKey del instructor} → emailKey de su usuario de socio, y las
           reglas (database.rules.json) aceptan ese alias para leer cc_cuenta_de, saldo y
           detalle de ESA cuenta. /cc_alias se carga a mano desde la consola (solo
           lectura para el propio instructor). Se sigue exigiendo que la sesión de Auth
           sea la del instructor de la sesión de la app.
  v1.00 · 2026-11-19 · Pedido de Daniel: cada socio (alumno o piloto) ve su saldo y
           los comprobantes pendientes de su cuenta en el sistema de facturación del
           club. Los datos los importa el administrador cada semana desde turnos.html
           (Config → Cta. Cte., v8.83) a los nodos /cc_* de Firebase.
           Seguridad: la sesión de la app (sessionStorage 'lvoad-session') solo se usa
           para el gate y el nombre; los datos se leen con la sesión de Firebase Auth y
           las reglas de /cc_* solo dejan leer cc_cuenta_de/{emailKey}, cc_saldos/{c} y
           cc_detalle/{c} al dueño de esa cuenta (auth.token.email). Si la sesión de
           Auth no coincide con el usuario logueado (login simulado, instructor que
           entró como piloto, sesión de otro usuario en el mismo navegador) no se
           muestra nada.
           El reporte del facturador trae SOLO cuentas con deuda y SOLO comprobantes
           pendientes: una cuenta sin datos se muestra "Sin deuda pendiente" (no "al
           día": el reporte no informa saldos a favor).
==================================================================================
-->

<style>

body{font-family:var(--font-ui);font-size:15px;color:var(--text);background:var(--bg);min-height:100vh;letter-spacing:.02em;overflow-x:hidden;max-width:100vw;transition:background .25s,color .25s}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig={
  apiKey:"AIzaSyATPSaoOV_wKLaJR_dc1jgTzEF2L5p0tHk",
  authDomain:"turnos-lv-oad.firebaseapp.com",
  databaseURL:"https://turnos-lv-oad-default-rtdb.firebaseio.com",
  projectId:"turnos-lv-oad",
  storageBucket:"turnos-lv-oad.firebasestorage.app",
  messagingSenderId:"855020455192",
  appId:"1:855020455192:web:4b6d18f1b2efbb52faca6d"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app), auth=getAuth(app);
async function fbGet(p){const s=await get(child(ref(db),p));return s.exists()?s.val():null;}

// Mismo criterio que turnos.html (ek() y ccDescSaldo()).
const CC_UMBRAL=1;
const ek=e=>e.replace(/\./g,'_').replace(/@/g,'__at__');
const red=n=>Math.round((Number(n)||0)*100)/100;
const monto=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:2}).format(n||0);
const fechaTxt=iso=>{ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?`${m[3]}/${m[2]}/${m[1]}`:'—'; };
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

// ── SESIÓN / TIMEOUT (declarado antes del gate: gate() lo usa sincrónicamente) ──
const SESSION_TIMEOUT_MS=10*60*1000;
let session=null,_sessionTimer=null,_cargado=false;
function resetSessionTimer(){ if(!session)return; clearTimeout(_sessionTimer); _sessionTimer=setTimeout(()=>{ if(session) cerrarSesion(); },SESSION_TIMEOUT_MS); }
['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(ev=>document.addEventListener(ev,resetSessionTimer,{passive:true}));

window.cerrarSesion=function(){
  try{ sessionStorage.removeItem('lvoad-session'); }catch(_){}
  signOut(auth).catch(()=>{}).finally(()=>{ location.href='turnos.html'; });
};
window.toggleTheme=function(){
  const isLight=document.documentElement.classList.toggle('light');
  localStorage.setItem('lvoad-theme',isLight?'light':'dark');
};

function mostrarMensaje(txt){
  const c=document.getElementById('cc-cuerpo'); c.textContent='';
  c.appendChild(el('div','msg',txt));
  document.getElementById('cc-detalle-card').style.display='none';
  document.getElementById('cc-nota').style.display='none';
}

(function gate(){
  let s=null;
  try{ s=JSON.parse(sessionStorage.getItem('lvoad-session')||'null'); }catch(_){ s=null; }
  if(s && s.tipo==='alumno') session=s;
  if(!session){
    document.getElementById('gate-msg').style.display='block';
    setTimeout(()=>{ location.href='turnos.html'; },900);
    return;
  }
  document.getElementById('who-label').textContent=(session.nombre||session.username||'')+(session.rol==='piloto'?' · PILOTO':' · ALUMNO');
  document.getElementById('app-wrap').style.display='block';
  resetSessionTimer();
  if(session.simuladoPor){ mostrarMensaje('Login simulado: la cuenta corriente no se muestra (solo la ve el propio usuario).'); return; }
  // La sesión de Auth se restaura sola (misma origin que turnos.html). Se espera la
  // primera notificación; si no hay usuario o no es el de la sesión, no se muestra nada.
  onAuthStateChanged(auth,user=>{
    if(_cargado) return;
    if(!user||!user.email){ mostrarMensaje('Tu sesión no tiene acceso seguro a la cuenta corriente. Salí del turnero y volvé a entrar.'); return; }
    const emailAuth=user.email.toLowerCase();
    // v1.01: instructor que entró como piloto → la sesión de Auth es la del instructor
    // (email sintético); se resuelve su usuario de socio por /cc_alias.
    const esInstr=!!session.instructorOrigen;
    const emailEsperado=esInstr
      ? (typeof session.instructorOrigen==='string' ? (session.instructorOrigen+'@instructores.aeroclubriogrande.com.ar').toLowerCase() : null)
      : String(session.email||'').toLowerCase();
    const coincide=esInstr
      ? (emailEsperado ? emailAuth===emailEsperado : emailAuth.endsWith('@instructores.aeroclubriogrande.com.ar'))
      : (!!emailEsperado && emailAuth===emailEsperado);
    if(!coincide){ mostrarMensaje('La sesión segura no corresponde a tu usuario (puede haber otra cuenta abierta en este navegador). Salí del turnero y volvé a entrar.'); return; }
    _cargado=true;
    if(esInstr) cargarCuentaInstructor(ek(emailAuth));
    else cargarCuenta(ek(emailAuth));
  });
})();

async function cargarCuentaInstructor(instKey){
  try{
    const socioKey=await fbGet('cc_alias/'+instKey);
    if(!socioKey){ mostrarMensaje('Tu usuario de instructor no está asociado a tu cuenta del club. Pedile a administración que la asocie, o ingresá con tu email de piloto/alumno.'); return; }
    cargarCuenta(socioKey);
  }catch(e){
    console.warn('portal socio (alias):',e);
    mostrarMensaje('No se pudo verificar tu acceso a la cuenta corriente. Salí del turnero y volvé a entrar; si sigue, avisá en administración.');
  }
}

async function cargarCuenta(emailKey){
  try{
    const cuenta=await fbGet('cc_cuenta_de/'+emailKey);
    if(!cuenta){ mostrarMensaje('Tu usuario todavía no está vinculado a una cuenta del sistema de facturación del club. Consultá en administración.'); return; }
    const [meta,saldoNodo,detalle]=await Promise.all([fbGet('cc_meta'),fbGet('cc_saldos/'+cuenta),fbGet('cc_detalle/'+cuenta)]);
    if(!meta){ mostrarMensaje('Todavía no hay información de cuenta corriente cargada.'); return; }
    render(cuenta,meta,saldoNodo,detalle);
  }catch(e){
    console.warn('portal socio:',e);
    const permiso=e?.code==='PERMISSION_DENIED'||/permission/i.test(e?.message||'');
    mostrarMensaje(permiso?'No se pudo verificar tu acceso a la cuenta corriente. Salí del turnero y volvé a entrar; si sigue, avisá en administración.':'No se pudo cargar la cuenta corriente (sin conexión o error del servidor). Probá de nuevo en un rato.');
  }
}

function render(cuenta,meta,saldoNodo,detalle){
  const saldo=red(saldoNodo?.saldo||0);
  const items=Array.isArray(detalle?.items)?detalle.items:Object.values(detalle?.items||{});
  const c=document.getElementById('cc-cuerpo'); c.textContent='';
  c.appendChild(el('div','cli','CLIENTE N° '+String(cuenta).replace(/^c/,'')+(saldoNodo?.nombre?' · '+saldoNodo.nombre:'')));
  let txt,color;
  if(saldo>=CC_UMBRAL){ txt=monto(saldo); color='var(--red)'; c.appendChild(el('div','saldo-sub','SALDO A PAGAR')); }
  else if(saldo<=-CC_UMBRAL){ txt=monto(-saldo); color='var(--green)'; c.appendChild(el('div','saldo-sub','SALDO A FAVOR')); }
  else { txt='Sin deuda pendiente'; color='var(--green)'; }
  const n=el('div','saldo-num',txt); n.style.color=color; c.appendChild(n);
  c.appendChild(el('div','saldo-sub','Información al '+(meta.corte_txt||'?')+' · fuente: facturación del club'));

  _ccItems=items; _ccSaldo=saldo; _ccColor=color;
  _ccVistaFact=false;
  pintarDetalle();

  const nota=document.getElementById('cc-nota');
  nota.textContent='Datos informativos importados del sistema de facturación del club al '+(meta.corte_txt||'?')+'. Los pagos posteriores a esa fecha se verán en la próxima actualización. Ante cualquier diferencia, consultá en administración.';
  nota.style.display='block';
}

// ── Imputación deducida (v1.02) ─────────────────────────────────────────────
// El reporte trae facturas abiertas (pend>0) y créditos sin aplicar (pend<0: sobrantes
// de pagos, "resto a favor"). Se aplican los créditos a las facturas abiertas empezando
// por la más antigua. En centavos enteros para no arrastrar error de punto flotante.
function imputarCreditosFIFO(items){
  const cts=n=>Math.round((Number(n)||0)*100);
  const orden=[...items].sort((a,b)=>(a.f||'').localeCompare(b.f||''));
  let credito=orden.reduce((s,i)=>s+(cts(i.pend)<0?-cts(i.pend):0),0);
  const abiertas=[];
  for(const it of orden){
    const p=cts(it.pend); if(p<=0) continue;
    const aplicado=Math.min(credito,p); credito-=aplicado;
    const resta=p-aplicado;
    if(resta>0) abiertas.push({...it,pend:resta/100,parcial:aplicado>0});
  }
  return {abiertas,creditoSobrante:credito/100};
}
let _ccItems=[],_ccSaldo=0,_ccColor='',_ccVistaFact=false;
window.ccCambiarVista=function(){ _ccVistaFact=!_ccVistaFact; pintarDetalle(); };

// Tipo de movimiento deducido de la numeración del facturador y del signo (v1.03).
function tipoMovimiento(it){
  const m=/^([ABX])-\d{4}-\d+/.exec(String(it.comp||'').trim()), neg=red(it.pend)<0;
  if(m&&m[1]==='X') return {txt:'PAGO',cls:'ok',d2:'Recibo '+it.comp};
  if(m) return neg?{txt:'NOTA DE CRÉDITO',cls:'ok',d2:'Comprobante '+it.comp}:{txt:'FACTURA',cls:'deb',d2:'Factura '+it.comp};
  const n=it.comp?'N° '+it.comp+' · ':'';
  return neg?{txt:'PAGO / AJUSTE',cls:'ok',d2:n+'cargado a mano en el facturador'}:{txt:'CARGO',cls:'deb',d2:n+'cargado a mano en el facturador'};
}
// Texto legible del concepto: saca el número repetido y los "..." del facturador.
function conceptoLegible(it,tipo){
  let c=String(it.ref||'').replace(it.comp||'\u0000','').replace(/\.{2,}$/,'').replace(/[\s\-–:]+$/,'').trim();
  if(/^factura$/i.test(c)||!c) c=tipo.txt==='FACTURA'?'Factura':(tipo.cls==='ok'?'Pago':'Cargo');
  if(/^cancelaci[oó]n de factura/i.test(c)) c='Pago (parte sin aplicar a facturas)';
  return c.charAt(0).toUpperCase()+c.slice(1);
}
function celdaDetalle(it,tipo,extra){
  const d=el('div','det');
  d.appendChild(el('div','d1',conceptoLegible(it,tipo)+(extra||'')));
  d.appendChild(el('div','d2',tipo.d2));
  return d;
}
function celdaMonto(v,lbl,cls){
  const c=el('div','num '+(cls||''),v==null?'—':monto(v)); c.dataset.lbl=lbl;
  if(v==null) c.classList.add('vacio');
  return c;
}

function pintarDetalle(){
  const card=document.getElementById('cc-detalle-card'),lista=document.getElementById('cc-lista');
  const tit=document.getElementById('cc-detalle-titulo'),ayuda=document.getElementById('cc-detalle-ayuda'),btn=document.getElementById('cc-btn-vista');
  lista.textContent='';
  const items=_ccItems;
  if(!items.length){ card.style.display='none'; return; }
  const hayCreditos=items.some(i=>red(i.pend)<0);
  const vistaFact=_ccVistaFact&&hayCreditos;
  btn.style.display=hayCreditos?'':'none';
  btn.textContent=vistaFact?'← VOLVER A FACTURAS IMPAGAS':'VER EL DETALLE COMO FIGURA EN EL FACTURADOR →';
  lista.classList.toggle('v-fact',vistaFact);

  if(!vistaFact){
    // ── Facturas impagas (vista principal) ──
    const r=imputarCreditosFIFO(items);
    tit.textContent='▸ Facturas impagas';
    ayuda.textContent=hayCreditos
      ?'Lo que te falta pagar de cada factura. Tus pagos ya están descontados (se aplican primero a las facturas más viejas).'
      :'Lo que te falta pagar de cada factura.';
    const h=el('div','fila head'); ['Fecha','Factura','Falta pagar'].forEach((t,i)=>h.appendChild(el('div',i===2?'num':'',t))); lista.appendChild(h);
    for(const it of r.abiertas){
      const tipo=tipoMovimiento(it), f=el('div','fila');
      f.appendChild(el('div','f',fechaTxt(it.f)));
      const parcial=Math.abs(red(it.imp))-red(it.pend)>0.004;
      f.appendChild(celdaDetalle(it,tipo,parcial?' — pagada en parte (total '+monto(it.imp)+')':''));
      f.appendChild(celdaMonto(it.pend,'Falta pagar'));
      lista.appendChild(f);
    }
    if(r.creditoSobrante>0.004){
      const f=el('div','fila'); f.appendChild(el('div','f','—'));
      const d=el('div','det'); d.appendChild(el('div','d1','Saldo a favor que sobra')); d.appendChild(el('div','d2','pagos que superan lo facturado')); f.appendChild(d);
      f.appendChild(celdaMonto(-r.creditoSobrante,'A favor','neg')); lista.appendChild(f);
    }
    const t=el('div','fila total'); t.appendChild(el('div','lbl','TOTAL A PAGAR'));
    const tp=celdaMonto(_ccSaldo,''); tp.style.color=_ccColor; t.appendChild(tp); lista.appendChild(t);
  }else{
    // ── Detalle tal cual el facturador ──
    tit.textContent='▸ Detalle como figura en el facturador';
    ayuda.textContent='Cada renglón es una factura que todavía tiene algo para pagar, o un pago que el club todavía no aplicó a ninguna factura. Tu saldo es lo que debés menos lo que tenés a favor.';
    const h=el('div','fila head'); ['Fecha','Tipo','Detalle','Debe','A favor'].forEach((t,i)=>h.appendChild(el('div',i>=3?'num':'',t))); lista.appendChild(h);
    let debe=0,favor=0;
    for(const it of items){
      const tipo=tipoMovimiento(it), v=red(it.pend), f=el('div','fila');
      f.appendChild(el('div','f',fechaTxt(it.f)));
      const tp=el('div','tp'); tp.appendChild(el('span','tipo '+tipo.cls,tipo.txt)); f.appendChild(tp);
      const parcial=Math.abs(Math.abs(red(it.imp))-Math.abs(v))>0.004;
      f.appendChild(celdaDetalle(it,tipo,parcial?' (queda '+monto(Math.abs(v))+' de '+monto(Math.abs(it.imp))+')':''));
      if(v>=0){ debe+=v; f.appendChild(celdaMonto(v,'Debe')); f.appendChild(celdaMonto(null,'A favor')); }
      else { favor+=-v; f.appendChild(celdaMonto(null,'Debe')); f.appendChild(celdaMonto(-v,'A favor','neg')); }
      lista.appendChild(f);
    }
    const t1=el('div','fila total'); t1.appendChild(el('div','lbl','Subtotales'));
    t1.appendChild(celdaMonto(red(debe),'Debe')); t1.appendChild(celdaMonto(red(favor),'A favor','neg')); lista.appendChild(t1);
    const t2=el('div','fila total'); t2.appendChild(el('div','lbl','SALDO (debe − a favor)'));
    t2.appendChild(el('div','x2 vacio-desk')); const ts=celdaMonto(_ccSaldo,''); ts.style.color=_ccColor; t2.appendChild(ts); lista.appendChild(t2);
  }
  card.style.display='block';
}
</script>
