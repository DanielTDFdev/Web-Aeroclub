<!DOCTYPE html>
<!--
==================================================================================
  REPORTE DE ACTIVIDAD DE AERONAVES — Aeroclub Río Grande 
  v1.18 · Pedido de Daniel: el reporte por instructor ya no incluye vuelos
         particulares (tipo_vuelo==='particular') — caían en el grupo "(sin
         instructor registrado)". Ese grupo queda solo para instrucciones
         cargadas sin instructor, renombrado "(instrucción sin instructor)".

  v1.17 · FIX reportado por Daniel: el selector de instructor omitía a los
         instructores con vacaciones===true (filtro heredado de disponibilidad,
         incorrecto en un reporte histórico) y mostraba la cuenta 'Admin'.
         cargarInstructores() ahora excluye admin/administrador/soloUsuarios,
         incluye los de vacaciones y ordena alfabéticamente.

  v1.16 · Nuevo estado real 'volado' (ver turnos.html v8.39). clasificar() ahora
         reconoce r.estado==='volado' directo — sin esto, los vuelos migrados a
         'volado' desaparecían del reporte (no matcheaban ninguna rama existente).

  v1.15 · FIX reportado por Daniel: el Excel exportado (Detalle de aeronaves/
         instructor/alumno) salía SIN ordenar por fecha — _datosAeronaves/
         _datosInstructor/_datosAlumno se armaban con .map() directo sobre
         filtradas/filtrados, en el orden de creación del turno en Firebase,
         no por fecha de vuelo. La tabla en pantalla sí ordena (variable
         `ordenados`, sort por fecha+hora desc) así que un alumno con DOS
         turnos el mismo día (uno no volado a la mañana, otro volado a la
         tarde) los veía juntos en pantalla pero salteados en cualquier lado
         del Excel — parecía un dato faltante/contradictorio cuando en
         realidad estaban los dos, solo que desordenados. Fix: las tres
         fuentes ahora se ordenan (mismo criterio que `ordenados`: fecha
         desc, hora desc) antes de mapear a filas de Excel.

  v1.14 · Pedido de Daniel: tercera sección "◈ Horas por alumno/piloto", mismo
         patrón que la de instructor (fechas desde/hasta + selector, GENERAR,
         PDF/EXCEL). Selector poblado desde /alumnos (value=email, más estable
         que nombre para agrupar — evita colisiones de homónimos). Se agrupa
         por email; cada alumno/piloto muestra sus stats (vuelos volados,
         horas, aterrizajes, no volados) y el detalle de turnos con quién lo
         instruyó/aprobó en cada uno (columna Instructor, inversa de la tabla
         del reporte de instructor que muestra el alumno). imprimirPDF() ahora
         soporta 3 modos (aviones/instructor/alumno) — cada botón PDF imprime
         solo su sección, ocultando las otras dos.

  v1.13 · Fix relacionado a turnos.html v7.92 (bug de aprobado_por en VUELO
         HISTÓRICO, ver ese comentario): clasificar() ahora también entra a la
         rama esVolado() cuando r.es_historico es true, no solo con
         aprobado_por o tipo_vuelo particular — un histórico de INSTRUCCIÓN
         sin instructor especificado (campo opcional en ese formulario) tiene
         igual todos los datos (tiempo de vuelo es obligatorio ahí) y no debe
         caer en vencido_sin_aprobar.

  v1.12 · Regla de negocio de Daniel: un turno es "VOLADO" si tiene CUALQUIERA
         de estos 3 campos cargado — tiempo de vuelo, aterrizajes, u
         observación privada — no solo tiempo de vuelo. clasificar() solo
         miraba horasDe(r), así que un vuelo con aterrizajes u obs pero sin
         tiempo cargado seguía cayendo mal en NO VOLADO. Fix: helper nuevo
         esVolado(r) = horasDe(r)!=null || aterrDe(r)!=null || obsDe(r) (con
         obsDe(r) nuevo, mismo fallback obs_privada→piloto_obs), usado en
         ambas ramas de clasificar() en vez de chequear horasDe(r) solo.

  v1.11 · Pedido de Daniel tras probar v1.10: seguía mal para los particulares
         autoservicio (vuelo-piloto.html) — se veían como "NO VOLADO" pese a
         tener datos. Causa: esos vuelos NO escriben obs_privada_tiempo_vuelo/
         obs_privada_aterrizajes (eso lo carga un instructor) — escriben
         piloto_tiempo_vuelo/piloto_aterrizajes. clasificar() y TODAS las
         sumas/tablas/exports de horas·aterrizajes miraban solo el primer par
         de campos. Fix: helpers nuevos horasDe(r)/aterrDe(r) con el mismo
         fallback que ya usa turnos.html (obs_privada_* si existe, si no
         piloto_*) — reemplazan los ~17 usos directos de esos campos en todo
         el archivo (clasificar, stats por avión/instructor, tablas, exports
         Excel).

  v1.10 · Pedido de Daniel: turno de piloto PARTICULAR (autoaprobado, sin
         aprobado_por por diseño — ver turnos.html) que venció caía siempre
         en 'vencido_sin_aprobar' aunque tuviera datos de vuelo cargados,
         porque clasificar() solo miraba aprobado_por para decidir si el
         turno "se realizó". Caso real: Tony Garcia, LV-ART, 27/08 — voló
         (1.0hs, 1 aterrizaje) pero figuraba como "VEN. S/APRO.". Fix:
         clasificar() ahora también entra a la rama 'volado'/'no_realizado'
         cuando r.tipo_vuelo==='particular', no solo cuando hay aprobado_por.
         'vencido_sin_aprobar' queda reservado para turnos de INSTRUCCIÓN
         que de verdad nadie aprobó.

  v1.9 · Pedido de Daniel: un turno vencido+aprobado sin tiempo/aterrizajes
         cargados se mostraba como "REALIZ. S/OBS" en verde, como si se
         hubiera volado y solo faltara el papeleo. Daniel: eso es incorrecto
         — un turno vencido sin datos cargados significa que NO SE VOLÓ (no
         hay forma de distinguir "se voló, falta cargar" de "no se
         presentó" con los datos actuales, así que se asume lo más simple y
         verificable). Cambios: clasificar() renombra esa categoría de
         'aprobado_pasado_sin_obs' a 'no_realizado'; deja de contar como
         vuelo en TODOS los totales (stats globales del reporte por
         instructor, stat "Vuelos volados"/"Vuelos supervisados" por
         instructor y por avión); badge nuevo gris "NO VOLADO" (antes verde
         "REALIZ. S/OBS"/"S/OBS"); labels actualizados ("Sin obs." → "No
         volados", "Vuelos c/obs" → "Vuelos volados", "Total vuelos" →
         "Total turnos"). Sigue apareciendo en las listas/tablas (para que
         el instructor vea sus ausencias/no-shows), solo que ya no cuenta
         como vuelo realizado. De paso: el resumen Excel (ambas hojas,
         por avión y por instructor) filtraba por el texto literal viejo
         'Realizado s/obs' — con el label nuevo esos filtros quedaban rotos
         (0 siempre); corregidos a 'No volado'.
  v1.8 · Pedido de Daniel: mismo fix que turnos.html v7.72 — iOS Safari hacía
         auto-zoom al enfocar cualquier filtro de fecha/avión/instructor (12px,
         debajo del umbral de 16px de Safari), y el zoom quedaba pegado hasta
         sacarlo a mano. .field-g input/select pasa a 16px.
  v1.7 · Pedido de Daniel: acceso ampliado a todos los instructores (antes
         exclusivo admin/administrador). checkAccess() ahora valida solo
         session.tipo==='instructor' (turnos.html reserva ese tipo para
         instructores/admin, nunca alumno/piloto). Mensaje de gate actualizado.
         Ver también turnos.html v7.67 (botón del panel dejó de ocultarse).
  v1.6 · FIX: el PDF (window.print()) imprimía juntas la sección de aeronaves y
         la de instructor si ambas habían sido generadas en la misma sesión —
         el CSS @media print forzaba display:block!important en #reporte Y
         #reporte-inst sin distinguir qué botón PDF se apretó. Nueva función
         imprimirPDF(seccion) marca <body class="print-aviones|print-instructor">
         antes de imprimir; el CSS oculta la sección que no corresponde. Excel
         ya exportaba cada sección por separado (sin cambios ahí).
  v1.5 · FIX: fmtHoras() (totales acumulados) redondeaba y mostraba con hasta
         2 decimales (ej: 69.90 hs) — debía ser 1 decimal, consistente con el
         resto del sistema. Ahora Math.round(h*10)/10 + toFixed(1).
  v1.4 · Exportación a Excel (.xlsx) en ambas secciones. Botón verde "⬇ EXCEL"
         al lado del PDF. Genera dos hojas: "Detalle" (todos los registros
         filtrados) y "Resumen por aeronave"/"Resumen por instructor" (totales).
         Nombre de archivo incluye aeronave/instructor y período. Usa SheetJS.
  v1.3 · Horas individuales (por vuelo en las tablas) se muestran tal cual están
         en Firebase (ej: 1.1, 0.8, 1.7 hs) en vez de convertirlas a formato
         horas+minutos. Los totales acumulados siguen mostrando la suma decimal
         con hasta 2 cifras (ej: 12.40 hs).
  v1.2 · Segunda sección: reporte de horas por instructor. Selector de instructor
         (poblado desde /instructores en Firebase), rango de fechas propio,
         totales globales y detalle por instructor con tabla de vuelos. Solo
         cuenta vuelos realizados (volado + aprobado_pasado_sin_obs). Ordenado
         por horas desc. Botón PDF independiente.
  v1.1 · FIX: clasificar() no reconocía los vuelos realizados. En el sistema,
         un turno aprobado que llega a su horario pasa a estado 'vencido' con
         aprobado_por seteado (comportamiento documentado en turnos.html v6.52).
         La v1.0 trataba vencido+aprobado_por como 'vencido_confirmado' en vez
         de 'volado' — resultado: 0 vuelos y 0 horas en todos los reportes.
         Fix: vencido+aprobado_por+tiempo_vuelo → 'volado';
              vencido+aprobado_por+sin tiempo → 'aprobado_pasado_sin_obs'.
         También se eliminó la categoría 'vencido_confirmado' que ya no aplica.
  v1.0 · 2026-08-03
  Acceso: todos los instructores (session.tipo==='instructor', lee sessionStorage 'lvoad-session').
  Datos: Firebase RTDB turnos-lv-oad-default-rtdb.
  Horas de vuelo: obs_privada_tiempo_vuelo (cargado por instructor post-vuelo).
  Vuelo "volado": aprobado+fecha_pasada+tiempo_vuelo cargado.
  Exporta a PDF via window.print() con @media print.
==================================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reporte de Actividad — Aeroclub Río Grande</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* ── Fuentes ─────────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700&display=swap');

/* ── Variables ───────────────────────────────────────────── */
:root{
  --navy:   #0B1F3A;
  --blue:   #1A3A5C;
  --blue2:  #1e4976;
  --cyan:   #00c8d4;
  --amber:  #f0a500;
  --green:  #22c55e;
  --red:    #ef4444;
  --purple: #a855f7;
  --gray:   #6B7280;
  --text:   #e2f0ff;
  --text2:  #90a4b7;
  --text3:  #5a7a9a;
  --border: rgba(0,200,212,.18);
  --border2:rgba(0,200,212,.35);
  --font-mono:'Share Tech Mono',monospace;
  --font-ui:'Rajdhani',sans-serif;
  --font-title:'Orbitron',sans-serif;
  --radius: 6px;
}

/* ── Reset / base ────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--navy);color:var(--text);font-family:var(--font-ui);font-size:15px;}

/* ── Layout ──────────────────────────────────────────────── */
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 80px}

/* ── Header ──────────────────────────────────────────────── */
header.bar{
  display:flex;align-items:center;gap:14px;
  background:var(--blue);border:1px solid var(--border2);
  border-radius:var(--radius);padding:12px 20px;margin-bottom:24px;
}
header.bar .dot{width:11px;height:11px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 10px var(--cyan);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
header.bar h1{font-family:var(--font-title);font-size:16px;letter-spacing:2px;
  color:var(--text);text-transform:uppercase}
header.bar h1 small{color:var(--amber);letter-spacing:2px;display:block;
  font-size:10px;font-family:var(--font-mono);margin-top:2px}
header.bar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
header.bar .ver{font-family:var(--font-mono);font-size:11px;color:var(--text3);
  border:1px solid var(--border);border-radius:4px;padding:2px 7px;letter-spacing:1px}

/* ── Gate ────────────────────────────────────────────────── */
#gate{text-align:center;padding:80px 20px;font-family:var(--font-mono);color:var(--text2)}
#gate h2{color:var(--red);margin-bottom:12px;font-size:20px}

/* ── Filtros ─────────────────────────────────────────────── */
.filtros-card{background:var(--blue);border:1px solid var(--border2);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:24px}
.filtros-card h2{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;
  color:var(--cyan);margin-bottom:14px;text-transform:uppercase}
.filtros-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field-g{display:flex;flex-direction:column;gap:5px}
.field-g label{font-family:var(--font-mono);font-size:11px;color:var(--text3);
  letter-spacing:.08em;text-transform:uppercase}
.field-g input,.field-g select{
  background:#0d2640;border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);font-family:var(--font-mono);font-size:12px;
  padding:7px 10px;outline:none;transition:border .2s}
.field-g input:focus,.field-g select:focus{border-color:var(--cyan)}
/* v1.8 — mismo fix que turnos.html v7.72: iOS Safari hace auto-zoom al enfocar
   cualquier input/select con font-size menor a 16px (acá 12px). Sin !important —
   no hay estilos inline pisando esta regla. Sin gate de @media(max-width) porque
   este archivo no tenía ninguno para mobile todavía y 16px en desktop no molesta. */
.field-g input,.field-g select{font-size:16px}
.btn-gen{
  background:var(--cyan);color:var(--navy);border:none;border-radius:var(--radius);
  font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.08em;
  padding:8px 22px;cursor:pointer;transition:opacity .2s;text-transform:uppercase}
.btn-gen:hover{opacity:.85}
.btn-pdf{
  background:transparent;color:var(--amber);border:1px solid var(--amber);
  border-radius:var(--radius);font-family:var(--font-mono);font-size:11px;
  font-weight:700;letter-spacing:.08em;padding:7px 16px;cursor:pointer;
  transition:all .2s;text-transform:uppercase}
.btn-pdf:hover{background:var(--amber);color:var(--navy)}
.btn-xls{
  background:transparent;color:#22c55e;border:1px solid #22c55e;
  border-radius:var(--radius);font-family:var(--font-mono);font-size:11px;
  font-weight:700;letter-spacing:.08em;padding:7px 16px;cursor:pointer;
  transition:all .2s;text-transform:uppercase}
.btn-xls:hover{background:#22c55e;color:var(--navy)}
.btn-back{
  background:transparent;color:var(--text2);border:1px solid var(--border);
  border-radius:var(--radius);font-family:var(--font-mono);font-size:11px;
  padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-block;
  transition:all .15s}
.btn-back:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── Spinner ─────────────────────────────────────────────── */
#spinner{display:none;text-align:center;padding:40px;font-family:var(--font-mono);
  color:var(--cyan);font-size:13px}

/* ── Reporte ─────────────────────────────────────────────── */
#reporte{display:none}

/* ── Resumen ejecutivo ───────────────────────────────────── */
.reporte-header{margin-bottom:28px}
.reporte-header h2{font-family:var(--font-title);font-size:20px;color:var(--cyan);
  letter-spacing:2px;margin-bottom:4px}
.reporte-header p{font-family:var(--font-mono);font-size:11px;color:var(--text3)}

/* Stats globales */
.stats-globales{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;margin-bottom:28px}
.stat-box{background:var(--blue);border:1px solid var(--border2);border-radius:var(--radius);
  padding:14px 16px;text-align:center}
.stat-box .num{font-family:var(--font-title);font-size:28px;color:var(--cyan);display:block}
.stat-box .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text3);
  letter-spacing:.08em;text-transform:uppercase;margin-top:4px;display:block}
.stat-box.green .num{color:var(--green)}
.stat-box.amber .num{color:var(--amber)}
.stat-box.red   .num{color:var(--red)}
.stat-box.purple .num{color:var(--purple)}

/* ── Sección por avión ───────────────────────────────────── */
.avion-section{margin-bottom:36px}
.avion-header{
  display:flex;align-items:center;gap:12px;
  background:var(--blue2);border:1px solid var(--border2);
  border-radius:var(--radius) var(--radius) 0 0;
  padding:12px 18px}
.avion-header .mat{
  font-family:var(--font-title);font-size:18px;color:var(--cyan);letter-spacing:2px}
.avion-header .modelo{
  font-family:var(--font-mono);font-size:11px;color:var(--text3)}
.avion-header .horas-badge{
  margin-left:auto;background:rgba(0,200,212,.15);border:1px solid var(--cyan);
  border-radius:4px;padding:4px 12px;font-family:var(--font-mono);font-size:13px;
  color:var(--cyan);font-weight:700}

/* Stats del avión */
.avion-stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:1px;background:var(--border);
  border:1px solid var(--border2);border-top:none}
.avion-stat{background:var(--navy);padding:12px 14px;text-align:center}
.avion-stat .n{font-family:var(--font-title);font-size:22px;display:block}
.avion-stat .l{font-family:var(--font-mono);font-size:9px;color:var(--text3);
  letter-spacing:.07em;text-transform:uppercase;margin-top:3px;display:block}
.avion-stat.c-green .n{color:var(--green)}
.avion-stat.c-amber .n{color:var(--amber)}
.avion-stat.c-red   .n{color:var(--red)}
.avion-stat.c-purple .n{color:var(--purple)}
.avion-stat.c-gray  .n{color:var(--text3)}
.avion-stat.c-cyan  .n{color:var(--cyan)}

/* Tabla de detalle */
.tabla-wrap{border:1px solid var(--border2);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow-x:auto}
table.det{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11px}
table.det thead tr{background:var(--blue2)}
table.det thead th{
  padding:8px 10px;text-align:left;color:var(--text3);
  font-weight:400;letter-spacing:.06em;text-transform:uppercase;
  border-bottom:1px solid var(--border2);white-space:nowrap}
table.det tbody tr{border-bottom:1px solid rgba(0,200,212,.07);transition:background .1s}
table.det tbody tr:hover{background:rgba(0,200,212,.05)}
table.det tbody td{padding:7px 10px;color:var(--text);vertical-align:middle}
table.det tbody td.muted{color:var(--text3)}
table.det tbody td.green{color:var(--green)}
table.det tbody td.amber{color:var(--amber)}
table.det tbody td.red{color:var(--red)}
table.det tbody td.purple{color:var(--purple)}
table.det tbody td.gray{color:var(--text3)}

/* Badges de estado */
.badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;
  font-family:var(--font-mono);letter-spacing:.05em;font-weight:700}
.badge.vol{background:rgba(34,197,94,.2);color:var(--green);border:1px solid var(--green)}
.badge.apr{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.4)}
.badge.can{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.4)}
.badge.ven{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.4)}
.badge.pen{background:rgba(240,165,0,.15);color:var(--amber);border:1px solid rgba(240,165,0,.4)}
.badge.nvo{background:rgba(148,163,184,.14);color:var(--text3);border:1px solid rgba(148,163,184,.35)}

/* Separador de sección */
.section-div{height:1px;background:var(--border);margin:8px 0}

/* Sin datos */
.empty-avion{padding:18px;text-align:center;font-family:var(--font-mono);
  font-size:11px;color:var(--text3);background:var(--navy);
  border:1px solid var(--border2);border-top:none;
  border-radius:0 0 var(--radius) var(--radius)}

/* ── @media print ────────────────────────────────────────── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important;color:#111!important}
  header.bar,#gate,#spinner,#spinner-inst,#spinner-alu,.filtros-card,.btn-pdf,.btn-pdf-inst,.btn-back,.btn-gen,hr{display:none!important}
  /* v1.6: imprimirPDF() marca <body> con print-aviones/print-instructor/print-alumno
     (v1.14) antes de window.print() — evita que las otras secciones salgan juntas en
     el PDF cuando fueron generadas en la misma sesión (antes se forzaba display:block
     en las tres sin importar cuál botón PDF se apretó). */
  body.print-aviones #reporte-inst,body.print-aviones #reporte-alu{display:none!important}
  body.print-instructor #reporte,body.print-instructor #reporte-alu{display:none!important}
  body.print-alumno #reporte,body.print-alumno #reporte-inst{display:none!important}
  #reporte,#reporte-inst,#reporte-alu{display:block!important}
  :root{
    --navy:#fff;--blue:#f0f4f8;--blue2:#e8eff7;
    --text:#111;--text2:#444;--text3:#666;
    --border:rgba(0,0,0,.15);--border2:rgba(0,0,0,.25);
    --cyan:#0066aa;--amber:#b45309;--green:#166534;
    --red:#991b1b;--purple:#6b21a8;
  }
  .wrap{padding:0}
  .avion-section{page-break-inside:avoid}
  .inst-section{page-break-inside:avoid}
  .tabla-wrap{overflow:visible}
  table.det{font-size:10px}
  .reporte-header h2{color:#0066aa!important}
  .print-title{display:block!important}
}
.print-title{display:none;font-size:12px;color:#666;margin-bottom:8px;font-family:sans-serif}

/* ── Sección instructor ──────────────────────────────────── */

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

// ── Estado para exportación Excel ────────────────────────────
let _datosAeronaves = []; // filas del reporte de aeronaves
let _datosInstructor = []; // filas del reporte de instructor
let _datosAlumno = []; // filas del reporte de alumno/piloto
let _paramsAeronaves = {}; // parámetros usados al generar
let _paramsInstructor = {};
let _paramsAlumno = {};

// ── Firebase config ──────────────────────────────────────────
const app = initializeApp({
  apiKey:            'AIzaSyATPSaoOV_wKLaJR_dc1jgTzEF2L5p0tHk',
  authDomain:        'turnos-lv-oad.firebaseapp.com',
  databaseURL:       'https://turnos-lv-oad-default-rtdb.firebaseio.com',
  projectId:         'turnos-lv-oad',
  messagingSenderId: '855020455192',
  appId:             '1:855020455192:web:4b6d18f1b2efbb52faca6d',
});
const db = getDatabase(app);

// ── Helpers ──────────────────────────────────────────────────
const rArr = d => d ? Object.entries(d).map(([k,v])=>({...v,key:k})) : [];
const hoy  = () => { const d=new Date(); return fmtDate(d); };
const fmtDate = d => {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const fmtDD = s => s ? s.split('-').reverse().join('/') : '—';
const esc   = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Flota (matrícula → modelo)
const FLOTA = {
  'LV-OAD': 'Tomahawk PA-38-112',
  'LV-ART': 'Archer II PA-28-181',
  'LV-MPH': 'Lance II PA-32RT',
};

// ── Gate de acceso ───────────────────────────────────────────
function checkAccess() {
  try {
    const s = JSON.parse(sessionStorage.getItem('lvoad-session') || '{}');
    // v1.7 — pedido de Daniel: acceso ampliado a todos los instructores (antes
    // solo admin/administrador). Cualquier login con session.tipo==='instructor'
    // pasa (turnos.html ya reserva ese tipo para instructores/admin, nunca para
    // alumno/piloto — ver session={tipo:'instructor',...} en turnos.html).
    const esInstructor = s && s.tipo === 'instructor';
    return { ok: esInstructor, nombre: s.nombre || s.user || '' };
  } catch { return { ok: false, nombre: '' }; }
}

const { ok, nombre } = checkAccess();
const gate = document.getElementById('gate');
const gateMsg = document.getElementById('gate-msg');
const mainContent = document.getElementById('main-content');

if (!ok) {
  gateMsg.innerHTML = '<h2>Acceso restringido</h2><p style="margin-top:8px">Este reporte es exclusivo para instructores.<br>Iniciá sesión como instructor en <a href="turnos.html" style="color:var(--cyan)">turnos.html</a></p>';
} else {
  gate.style.display = 'none';
  mainContent.style.display = 'block';
  // Setear fechas default: mes actual
  const ahora = new Date();
  const primeroDeMes = new Date(ahora.getFullYear(), ahora.getMonth(), 1);
  document.getElementById('f-desde').value = fmtDate(primeroDeMes);
  document.getElementById('f-hasta').value = fmtDate(ahora);
}

// ── Horas/aterrizajes de un turno, con fallback a piloto_* ──────
// v1.11: los vuelos de piloto particular autoservicio (vuelo-piloto.html) NO escriben
// obs_privada_tiempo_vuelo/obs_privada_aterrizajes (esos son campos que carga un
// instructor) — escriben piloto_tiempo_vuelo/piloto_aterrizajes. Mismo fallback que ya
// usa turnos.html en todos lados (ver r.obs_privada_tiempo_vuelo!=null?...:r.piloto_tiempo_vuelo).
// Sin este helper, un vuelo particular autocargado por el piloto se veía "sin datos"
// aunque los tuviera, y clasificar() lo mandaba a NO VOLADO.
function horasDe(r) { return r.obs_privada_tiempo_vuelo != null ? r.obs_privada_tiempo_vuelo : r.piloto_tiempo_vuelo; }
function aterrDe(r) { return r.obs_privada_aterrizajes != null ? r.obs_privada_aterrizajes : r.piloto_aterrizajes; }
function obsDe(r) { return r.obs_privada || r.piloto_obs || ''; }
// v1.12, regla de negocio de Daniel: un turno es "VOLADO" si tiene CUALQUIERA de los 3
// campos cargado (tiempo de vuelo, aterrizajes, u obs privada) — no solo tiempo de vuelo.
// Antes clasificar() solo miraba horasDe(r), así que un vuelo con aterrizajes u obs pero
// sin tiempo cargado quedaba mal como NO VOLADO.
function esVolado(r) { return horasDe(r) != null || aterrDe(r) != null || !!obsDe(r); }

// ── Clasificar un turno ──────────────────────────────────────
// Retorna una de: 'volado' | 'aprobado_futuro' | 'cancelado_alumno' |
//                'cancelado_instructor' | 'vencido_confirmado' |
//                'vencido_sin_aprobar' | 'pendiente' | 'cargado_staff'
function clasificar(r) {
  const hoyStr = hoy();
  const esPasado = r.fecha < hoyStr;
  if (r.cargado_por && r.estado === 'cancelado') return 'cancelado_instructor';
  // v1.16 (Daniel, turnos.html v8.39): 'volado' ahora puede ser un estado real escrito
  // directo por turnos.html/vuelo.html/vuelo-piloto.html — sin esta rama, los vuelos
  // migrados a 'volado' no matcheaban ninguna de las condiciones de abajo y caían en el
  // default (desaparecían del reporte).
  if (r.estado === 'volado') return 'volado';
  // estado 'aprobado' pasado — poco frecuente (barrido lazy del cliente puede no haberlo vencido aún)
  if (r.estado === 'aprobado' && esPasado) {
    return esVolado(r) ? 'volado' : 'no_realizado';
  }
  if (r.estado === 'aprobado' && !esPasado) return 'aprobado_futuro';
  if (r.estado === 'cancelado') {
    return r.cancelado_rol === 'instructor' ? 'cancelado_instructor' : 'cancelado_alumno';
  }
  if (r.estado === 'vencido') {
    // v1.10 fix: un turno de piloto PARTICULAR se autoaprueba sin escribir aprobado_por
    // (ver turnos.html — nunca pasa por un instructor). Antes esto lo hacía caer siempre en
    // 'vencido_sin_aprobar' aunque el vuelo se haya hecho y tenga datos cargados. Se trata
    // igual que un vencido CON aprobado_por: 'volado' si tiene tiempo/aterrizajes/obs cargado,
    // 'no_realizado' si no.
    // v1.13: un vuelo cargado como "VUELO HISTÓRICO" en turnos.html (es_historico:true)
    // SIEMPRE tiene datos (tiempo de vuelo es obligatorio en ese formulario) pero puede
    // no tener aprobado_por si se cargó como instrucción sin especificar el instructor
    // que voló (campo opcional) — sin este OR caía en 'vencido_sin_aprobar' aunque
    // tuviera todo cargado. Ver turnos.html v7.92 para el fix relacionado (antes ese
    // caso SIEMPRE tenía aprobado_por seteado por error, a nombre de quien cargó el
    // dato — ahora que eso está bien arreglado, hace falta este OR acá para no perder
    // la clasificación correcta en el caso legítimo de "no sé quién instruyó").
    if (r.aprobado_por || r.tipo_vuelo === 'particular' || r.es_historico) {
      // vencido CON aprobado_por = vuelo que se realizó (el avión salió y el turno venció por hora)
      // Si tiene algo cargado (tiempo, aterrizajes u obs) = 'volado'; si no, se considera que
      // NO se voló (pedido de Daniel: un turno vencido sin nada cargado es un no-show, no un
      // "vuelo pendiente de papeleo" — no hay forma de distinguir ambos casos con los datos
      // actuales, así que se asume lo más simple y verificable: sin datos = no se voló).
      return esVolado(r) ? 'volado' : 'no_realizado';
    }
    // vencido SIN aprobado_por Y de instrucción = pendiente que nadie aprobó, se venció automáticamente
    return 'vencido_sin_aprobar';
  }
  if (r.estado === 'pendiente') return 'pendiente';
  return 'otro';
}

// ── Parsear horas "H:MM" o "HH:MM" → número decimal ─────────
function parseHoras(s) {
  if (!s) return 0;
  s = String(s).trim();
  // Formato "1:30" → 1.5, "0:45" → 0.75, "2" → 2
  const m = s.match(/^(\d+):(\d{2})$/);
  if (m) return parseInt(m[1]) + parseInt(m[2]) / 60;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function rawHoras(s) {
  // Muestra el valor tal cual viene de Firebase (ej: "1.1", "0.8")
  if (!s && s !== 0) return '—';
  return String(s).trim() + ' hs';
}

function fmtHoras(h) {
  // Para totales acumulados (suma de decimales): muestra con hasta 1 decimal
  if (!h || h === 0) return '—';
  const r = Math.round(h * 10) / 10;
  return r % 1 === 0 ? r + ' hs' : r.toFixed(1) + ' hs';
}

// ── Generar reporte ──────────────────────────────────────────
document.getElementById('btn-generar').addEventListener('click', generarReporte);

async function generarReporte() {
  const desde = document.getElementById('f-desde').value;
  const hasta  = document.getElementById('f-hasta').value;
  const avionFiltro = document.getElementById('f-avion').value;

  if (!desde || !hasta) { alert('Seleccioná ambas fechas.'); return; }
  if (desde > hasta) { alert('La fecha "desde" debe ser anterior a "hasta".'); return; }

  document.getElementById('spinner').style.display = 'block';
  document.getElementById('reporte').style.display  = 'none';
  document.getElementById('btn-pdf').style.display  = 'none';

  let reservas = [];
  try {
    const snap = await get(ref(db, 'reservas'));
    reservas = rArr(snap.val());
  } catch(e) {
    document.getElementById('spinner').style.display = 'none';
    alert('Error al leer Firebase: ' + e.message);
    return;
  }

  // Filtrar por rango de fechas y avión
  const filtradas = reservas.filter(r => {
    if (!r.fecha) return false;
    if (r.fecha < desde || r.fecha > hasta) return false;
    if (avionFiltro !== 'todos' && (r.avion || 'LV-OAD') !== avionFiltro) return false;
    return true;
  });

  // Aviones a mostrar
  const aviones = avionFiltro === 'todos'
    ? Object.keys(FLOTA)
    : [avionFiltro];

  // Agrupar por avión
  const porAvion = {};
  aviones.forEach(av => { porAvion[av] = []; });
  filtradas.forEach(r => {
    const av = r.avion || 'LV-OAD';
    if (porAvion[av]) porAvion[av].push(r);
  });

  // ── Totales globales ────────────────────────────────────────
  let totVolados=0, totHoras=0, totAterrizajes=0, totCancelados=0,
      totVencidos=0, totPendientes=0, totAprobFut=0;

  aviones.forEach(av => {
    porAvion[av].forEach(r => {
      const cls = clasificar(r);
      if (cls === 'volado') {
        totVolados++;
        totHoras += parseHoras(horasDe(r));
        totAterrizajes += parseInt(aterrDe(r) || 0);
      }
      if (cls === 'cancelado_alumno' || cls === 'cancelado_instructor') totCancelados++;
      if (cls === 'vencido_sin_aprobar') totVencidos++;
      if (cls === 'pendiente') totPendientes++;
      if (cls === 'aprobado_futuro') totAprobFut++;
    });
  });

  // ── Render stats globales ───────────────────────────────────
  document.getElementById('stats-globales').innerHTML = `
    <div class="stat-box green"><span class="num">${totVolados}</span><span class="lbl">Vuelos realizados</span></div>
    <div class="stat-box cyan" style="--cyan:#00c8d4"><span class="num" style="color:var(--cyan)">${fmtHoras(totHoras)}</span><span class="lbl">Horas de vuelo</span></div>
    <div class="stat-box"><span class="num" style="color:#60a5fa">${totAterrizajes||'—'}</span><span class="lbl">Aterrizajes</span></div>
    <div class="stat-box red"><span class="num">${totCancelados}</span><span class="lbl">Cancelados</span></div>
    <div class="stat-box purple"><span class="num">${totVencidos}</span><span class="lbl">Vencidos</span></div>
    <div class="stat-box amber"><span class="num">${totPendientes + totAprobFut}</span><span class="lbl">Activos/futuros</span></div>
    <div class="stat-box"><span class="num" style="color:var(--text2)">${filtradas.length}</span><span class="lbl">Total registros</span></div>
  `;

  // ── Render por avión ────────────────────────────────────────
  const contAv = document.getElementById('aviones-detalle');
  contAv.innerHTML = '';

  aviones.forEach(av => {
    const rs = porAvion[av];
    const modelo = FLOTA[av] || '';

    // Estadísticas del avión
    let avVol=0, avHoras=0, avAterr=0, avCanAlumno=0, avCanInst=0,
        avVenSin=0, avPend=0, avFut=0, avSinObs=0;

    rs.forEach(r => {
      const cls = clasificar(r);
      if (cls === 'volado')               { avVol++; avHoras+=parseHoras(horasDe(r)); avAterr+=parseInt(aterrDe(r)||0); }
      if (cls === 'no_realizado') avSinObs++;
      if (cls === 'cancelado_alumno')      avCanAlumno++;
      if (cls === 'cancelado_instructor')  avCanInst++;
      if (cls === 'vencido_sin_aprobar')   avVenSin++;
      if (cls === 'pendiente')             avPend++;
      if (cls === 'aprobado_futuro')       avFut++;
    });

    // Ordenar por fecha desc
    const ordenados = [...rs].sort((a,b) => b.fecha.localeCompare(a.fecha) || (b.hora||'').localeCompare(a.hora||''));

    const filas = ordenados.map(r => {
      const cls = clasificar(r);
      const estado_txt = {
        'volado':                '<span class="badge vol">VOLADO</span>',
        'no_realizado':          '<span class="badge nvo">NO VOLADO</span>',
        'aprobado_futuro':       '<span class="badge apr">APROBADO</span>',
        'cancelado_alumno':      '<span class="badge can">CANC. ALUMNO</span>',
        'cancelado_instructor':  '<span class="badge can">CANC. INST.</span>',
        'vencido_sin_aprobar':   '<span class="badge ven">VEN. S/APRO.</span>',
        'pendiente':             '<span class="badge pen">PENDIENTE</span>',
        'otro':                  '<span class="badge" style="color:var(--text3)">OTRO</span>',
      }[cls] || '';

      const horas = cls === 'volado' ? `<span class="green">${rawHoras(horasDe(r))}</span>` : '<span class="muted">—</span>';
      const aterr = cls === 'volado' && aterrDe(r) ? `<span class="green">${aterrDe(r)}</span>` : '<span class="muted">—</span>';
      const instructor = esc(r.instructor || r.aprobado_por || r.cancelado_por || '—');
      const quien = esc((r.nombre || '—').split(' ').slice(0,2).join(' '));
      const tipoVuelo = (r.tipo_vuelo || 'instruccion') === 'particular' ? 'Particular' : 'Instrucción';
      const cargadoPor = r.cargado_por ? `<span style="color:var(--amber);font-size:9px">📋 ${esc(r.cargado_por)}</span>` : '';

      return `<tr>
        <td class="muted">${fmtDD(r.fecha)}</td>

// Poblar selector de instructores desde Firebase
async function cargarInstructores() {
  try {
    const snap = await get(ref(db, 'instructores'));
    const data = snap.val() || {};
    const sel = document.getElementById('i-inst');
    // Limpiar opciones anteriores excepto "Todos"
    while (sel.options.length > 1) sel.remove(1);
    // v1.17: antes excluía a los de vacaciones (un reporte histórico debe listarlos
    // igual — el flag solo suspende disponibilidad futura) e incluía las cuentas
    // admin/administrador. Mismo criterio que turnos.html: fuera admin/administrador
    // y soloUsuarios; vacaciones SÍ se listan. Orden alfabético.
    Object.entries(data)
      .filter(([key, inst]) => inst && key !== 'admin' && key !== 'administrador' && inst.soloUsuarios !== true)
      .map(([key, inst]) => inst.nombre || key)
      .sort((a, b) => a.localeCompare(b, 'es'))
      .forEach(nom => {
        const opt = document.createElement('option');
        opt.value = nom;
        opt.textContent = nom;
        sel.appendChild(opt);
      });
    // Agregar también instructores que aparecen en reservas pero no en /instructores
    // (carga del historial — se hace al generar)
  } catch(e) { console.warn('No se pudo cargar instructores:', e); }
}

if (ok) {
  cargarInstructores();

  document.getElementById('i-desde').value = fmtDate(primer2);
  document.getElementById('i-hasta').value = fmtDate(ahora2);

}

async function generarReporteAlumno() {
  const desde = document.getElementById('p-desde').value;
  const hasta = document.getElementById('p-hasta').value;
  const alumnoFiltro = document.getElementById('p-alumno').value;

  if (!desde || !hasta) { alert('Seleccioná ambas fechas.'); return; }
  if (desde > hasta)    { alert('La fecha "desde" debe ser anterior a "hasta".'); return; }

  document.getElementById('spinner-alu').style.display = 'block';
  document.getElementById('reporte-alu').style.display = 'none';
  document.getElementById('btn-pdf-alu').style.display = 'none';

  let reservas = [];
  try {
    const snap = await get(ref(db, 'reservas'));
    reservas = rArr(snap.val());
  } catch(e) {
    document.getElementById('spinner-alu').style.display = 'none';
    alert('Error al leer Firebase: ' + e.message);
    return;
  }

  const hoyStr = hoy();
  const volados = reservas.filter(r => {
    if (!r.fecha) return false;
    if (r.fecha < desde || r.fecha > hasta) return false;
    const cls = clasificar(r);
    return cls === 'volado' || cls === 'no_realizado';
  });

  // Clave de agrupación: email (estable) — nombre solo para mostrar, por si el
  // registro tiene email vacío en algún caso viejo (fallback al nombre).
  const claveDe = r => (r.email||'').trim().toLowerCase() || ('__sinemail__'+(r.nombre||'').trim());
  const nombreDe = r => r.nombre || r.email || '(sin nombre)';

  const filtrados = alumnoFiltro === 'todos'
    ? volados
    : volados.filter(r => (r.email||'').trim().toLowerCase() === alumnoFiltro.toLowerCase());

  // Agrupar por alumno/piloto
  const porAlu = {};
  filtrados.forEach(r => {
    const k = claveDe(r);
    if (!porAlu[k]) porAlu[k] = [];
    porAlu[k].push(r);
  });

  const aluOrdenados = Object.entries(porAlu).sort((a, b) => {
    const hA = a[1].reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    const hB = b[1].reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    return hB - hA;
  });

  // ── Totales globales ────────────────────────────────────────
  const totVol   = filtrados.filter(r => clasificar(r) === 'volado').length;
  const totHoras = filtrados.reduce((s,r) => s + parseHoras(horasDe(r)), 0);
  const totAterr = filtrados.reduce((s,r) => s + parseInt(aterrDe(r)||0), 0);
  const totNoRealizados = filtrados.filter(r => clasificar(r) === 'no_realizado').length;

  document.getElementById('alu-stats-globales').innerHTML = `
    <div class="stat-box green"><span class="num">${totVol}</span><span class="lbl">Vuelos realizados</span></div>
    <div class="stat-box" style="--cyan:#00c8d4"><span class="num" style="color:var(--cyan)">${fmtHoras(totHoras)}</span><span class="lbl">Horas totales</span></div>
    <div class="stat-box"><span class="num" style="color:#60a5fa">${totAterr||'—'}</span><span class="lbl">Aterrizajes</span></div>
    <div class="stat-box"><span class="num" style="color:var(--text3)">${totNoRealizados}</span><span class="lbl">No volados</span></div>
    <div class="stat-box"><span class="num" style="color:var(--text2)">${Object.keys(porAlu).length}</span><span class="lbl">Alumnos/Pilotos</span></div>
  `;

  // ── Render por alumno/piloto ─────────────────────────────────
  const cont = document.getElementById('alu-detalle');
  cont.innerHTML = '';

  if (aluOrdenados.length === 0) {
    cont.innerHTML = '<div class="empty-avion" style="border-radius:var(--radius)">Sin vuelos realizados en el período seleccionado.</div>';
  }

  aluOrdenados.forEach(([, rs]) => {
    const aluNombre = nombreDe(rs[0]);
    const aluRol = rs[0].rol === 'piloto' ? 'Piloto' : 'Alumno';
    const aHoras  = rs.reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    const aAterr  = rs.reduce((s,r) => s + parseInt(aterrDe(r)||0), 0);
    const aNoRealizados = rs.filter(r => clasificar(r) === 'no_realizado').length;
    const aVol    = rs.filter(r => clasificar(r) === 'volado').length;

    const aviones = [...new Set(rs.map(r => r.avion||'LV-OAD'))].join(' / ');
    const ordenados = [...rs].sort((a,b) => b.fecha.localeCompare(a.fecha)||(b.hora||'').localeCompare(a.hora||''));

    const filas = ordenados.map(r => {
      const cls = clasificar(r);
      const horas = cls==='volado'
        ? `<span class="green">${rawHoras(horasDe(r))}</span>`
        : '<span class="muted">—</span>';
      const aterr = cls==='volado' && aterrDe(r)
        ? `<span class="green">${aterrDe(r)}</span>`
        : '<span class="muted">—</span>';
      const estadoBadge = cls==='volado'
        ? '<span class="badge vol">VOLADO</span>'
        : '<span class="badge nvo">NO VOLADO</span>';
      const avion  = esc(r.avion||'LV-OAD');
      const tipo   = (r.tipo_vuelo||'instruccion')==='particular' ? 'Particular' : 'Instrucción';
      const inst   = esc((r.aprobado_por || r.instructor || '—'));
      return `<tr>
        <td class="muted">${fmtDD(r.fecha)}</td>
        <td class="muted">${r.hora||r.horaInicio||'—'}</td>
        <td class="muted">${avion}</td>
        <td class="muted">${tipo}</td>
        <td>${estadoBadge}</td>
        <td>${horas}</td>
        <td>${aterr}</td>
        <td class="muted">${inst}</td>
      </tr>`;
    }).join('');

    cont.innerHTML += `
      <div class="inst-section">
        <div class="inst-header">
          <div>
            <div class="iname">${esc(aluNombre)} <span style="font-size:11px;color:var(--text3);font-weight:400">(${aluRol})</span></div>
            <div class="iavion">Aeronaves: ${aviones}</div>
          </div>
          <div class="horas-badge">⏱ ${fmtHoras(aHoras)}</div>
        </div>
        <div class="inst-stats">
          <div class="inst-stat"><span class="n" style="color:var(--green)">${aVol}</span><span class="l">Vuelos volados</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--cyan)">${fmtHoras(aHoras)}</span><span class="l">Horas de vuelo</span></div>
          <div class="inst-stat"><span class="n" style="color:#60a5fa">${aAterr||'—'}</span><span class="l">Aterrizajes</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--text3)">${aNoRealizados}</span><span class="l">No volados</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--text3)">${rs.length}</span><span class="l">Total turnos</span></div>
        </div>
        <div class="tabla-wrap">
          <table class="det">
            <thead><tr>
              <th>Fecha</th><th>Hora</th><th>Avión</th><th>Tipo</th>
              <th>Estado</th><th>Hs. vuelo</th><th>Aterr.</th><th>Instructor</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        </div>
      </div>`;
  });

  const aluLabel = alumnoFiltro === 'todos'
    ? 'Todos'
    : (aluOrdenados[0] ? nombreDe(aluOrdenados[0][1][0]) : alumnoFiltro);
  document.getElementById('rep-alu-titulo').textContent =
    `HORAS POR ALUMNO/PILOTO — ${aluLabel.toUpperCase()}`;
  document.getElementById('rep-alu-subtitulo').textContent =
    `Período: ${fmtDD(desde)} al ${fmtDD(hasta)}  ·  Generado: ${fmtDD(hoyStr)}  ·  Por: ${nombre}`;

  _paramsAlumno = { desde, hasta, alumno: alumnoFiltro };
  _datosAlumno = [...filtrados].sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.hora||'').localeCompare(a.hora||'')).map(r => {
    const cls = clasificar(r);
    return {
      'Fecha': fmtDD(r.fecha),
      'Hora': r.hora || r.horaInicio || '',
      'Alumno/Piloto': nombreDe(r),
      'Rol': r.rol === 'piloto' ? 'Piloto' : 'Alumno',
      'Avión': r.avion || 'LV-OAD',
      'Tipo de vuelo': (r.tipo_vuelo||'instruccion')==='particular'?'Particular':'Instrucción',
      'Estado': cls==='volado'?'Volado':'No volado',
      'Horas de vuelo': horasDe(r) || '',
      'Aterrizajes': aterrDe(r) || '',
      'Instructor': r.aprobado_por || r.instructor || '',
    };
  });

  document.getElementById('spinner-alu').style.display = 'none';
  document.getElementById('reporte-alu').style.display = 'block';
  document.getElementById('btn-pdf-alu').style.display = 'block';
  document.getElementById('btn-xls-alu').style.display = 'block';

  document.getElementById('reporte-alu').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function generarReporteInstructor() {
  const desde = document.getElementById('i-desde').value;
  const hasta  = document.getElementById('i-hasta').value;
  const instFiltro = document.getElementById('i-inst').value;

  if (!desde || !hasta) { alert('Seleccioná ambas fechas.'); return; }
  if (desde > hasta)    { alert('La fecha "desde" debe ser anterior a "hasta".'); return; }

  document.getElementById('spinner-inst').style.display   = 'block';
  document.getElementById('reporte-inst').style.display   = 'none';
  document.getElementById('btn-pdf-inst').style.display   = 'none';

  let reservas = [];
  try {
    const snap = await get(ref(db, 'reservas'));
    reservas = rArr(snap.val());
  } catch(e) {
    document.getElementById('spinner-inst').style.display = 'none';
    alert('Error al leer Firebase: ' + e.message);
    return;
  }

  // Filtrar por rango de fechas — solo vuelos realizados (vencido+aprobado_por o aprobado+pasado)
  const hoyStr = hoy();
  const volados = reservas.filter(r => {
    if (!r.fecha) return false;
    if (r.fecha < desde || r.fecha > hasta) return false;
    // Solo vuelos realizados o no-realizados con turno aprobado (para que el instructor
    // también vea sus ausencias/no-shows, no solo lo que sí voló)
    // v1.18: los vuelos particulares no tienen instructor — no van en este reporte
    // (ya figuran en el de aeronaves y en el de alumno/piloto).
    if (r.tipo_vuelo === 'particular') return false;
    const cls = clasificar(r);
    return cls === 'volado' || cls === 'no_realizado';
  });

  // Determinar nombre del instructor para cada reserva
  // Fuente: aprobado_por > instructor (fallbacks del sistema)
  const instDe = r => (r.aprobado_por || r.instructor || '').trim() || '(instrucción sin instructor)';

  // Filtrar por instructor si se eligió uno específico
  const filtrados = instFiltro === 'todos'
    ? volados
    : volados.filter(r => instDe(r) === instFiltro);

  // Agrupar por instructor
  const porInst = {};
  filtrados.forEach(r => {
    const inst = instDe(r);
    if (!porInst[inst]) porInst[inst] = [];
    porInst[inst].push(r);
  });

  // Ordenar instructores por horas desc
  const instOrdenados = Object.entries(porInst).sort((a, b) => {
    const hA = a[1].reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    const hB = b[1].reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    return hB - hA;
  });

  // ── Totales globales ────────────────────────────────────────
  // totVol solo cuenta 'volado' — filtrados también incluye 'no_realizado' (para
  // que aparezcan en la lista/detalle), pero eso no debe sumar como vuelo supervisado.
  const totVol   = filtrados.filter(r => clasificar(r) === 'volado').length;
  const totHoras = filtrados.reduce((s,r) => s + parseHoras(horasDe(r)), 0);
  const totAterr = filtrados.reduce((s,r) => s + parseInt(aterrDe(r)||0), 0);
  const totNoRealizados = filtrados.filter(r => clasificar(r) === 'no_realizado').length;

  document.getElementById('inst-stats-globales').innerHTML = `
    <div class="stat-box green"><span class="num">${totVol}</span><span class="lbl">Vuelos supervisados</span></div>
    <div class="stat-box" style="--cyan:#00c8d4"><span class="num" style="color:var(--cyan)">${fmtHoras(totHoras)}</span><span class="lbl">Horas totales</span></div>
    <div class="stat-box"><span class="num" style="color:#60a5fa">${totAterr||'—'}</span><span class="lbl">Aterrizajes</span></div>
    <div class="stat-box"><span class="num" style="color:var(--text3)">${totNoRealizados}</span><span class="lbl">No volados</span></div>
    <div class="stat-box"><span class="num" style="color:var(--text2)">${Object.keys(porInst).length}</span><span class="lbl">Instructores</span></div>
  `;

  // ── Render por instructor ───────────────────────────────────
  const cont = document.getElementById('inst-detalle');
  cont.innerHTML = '';

  if (instOrdenados.length === 0) {
    cont.innerHTML = '<div class="empty-avion" style="border-radius:var(--radius)">Sin vuelos realizados en el período seleccionado.</div>';
  }

  instOrdenados.forEach(([instNombre, rs]) => {
    const iHoras  = rs.reduce((s,r) => s + parseHoras(horasDe(r)), 0);
    const iAterr  = rs.reduce((s,r) => s + parseInt(aterrDe(r)||0), 0);
    const iNoRealizados = rs.filter(r => clasificar(r) === 'no_realizado').length;
    const iVol    = rs.filter(r => clasificar(r) === 'volado').length;

    // Aviones distintos que voló
    const aviones = [...new Set(rs.map(r => r.avion||'LV-OAD'))].join(' / ');

    // Ordenar por fecha desc
    const ordenados = [...rs].sort((a,b) => b.fecha.localeCompare(a.fecha)||(b.hora||'').localeCompare(a.hora||''));

    const filas = ordenados.map(r => {
      const cls = clasificar(r);
      const horas = cls==='volado'
        ? `<span class="green">${rawHoras(horasDe(r))}</span>`
        : '<span class="muted">—</span>';
      const aterr = cls==='volado' && aterrDe(r)
        ? `<span class="green">${aterrDe(r)}</span>`
        : '<span class="muted">—</span>';
      const estadoBadge = cls==='volado'
        ? '<span class="badge vol">VOLADO</span>'
        : '<span class="badge nvo">NO VOLADO</span>';
      const alumno = esc((r.nombre||'—').split(' ').slice(0,2).join(' '));
      const avion  = esc(r.avion||'LV-OAD');
      const tipo   = (r.tipo_vuelo||'instruccion')==='particular' ? 'Particular' : 'Instrucción';
      return `<tr>
        <td class="muted">${fmtDD(r.fecha)}</td>
        <td class="muted">${r.hora||r.horaInicio||'—'}</td>
        <td>${esc(alumno)}</td>
        <td class="muted">${avion}</td>
        <td class="muted">${tipo}</td>
        <td>${estadoBadge}</td>
        <td>${horas}</td>
        <td>${aterr}</td>
      </tr>`;
    }).join('');

    cont.innerHTML += `
      <div class="inst-section">
        <div class="inst-header">
          <div>
            <div class="iname">${esc(instNombre)}</div>
            <div class="iavion">Aeronaves: ${aviones}</div>
          </div>
          <div class="horas-badge">⏱ ${fmtHoras(iHoras)}</div>
        </div>
        <div class="inst-stats">
          <div class="inst-stat"><span class="n" style="color:var(--green)">${iVol}</span><span class="l">Vuelos volados</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--cyan)">${fmtHoras(iHoras)}</span><span class="l">Horas de vuelo</span></div>
          <div class="inst-stat"><span class="n" style="color:#60a5fa">${iAterr||'—'}</span><span class="l">Aterrizajes</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--text3)">${iNoRealizados}</span><span class="l">No volados</span></div>
          <div class="inst-stat"><span class="n" style="color:var(--text3)">${rs.length}</span><span class="l">Total turnos</span></div>
        </div>
        <div class="tabla-wrap">
          <table class="det">
            <thead><tr>
              <th>Fecha</th><th>Hora</th><th>Alumno/Piloto</th>
              <th>Avión</th><th>Tipo</th><th>Estado</th>
              <th>Hs. vuelo</th><th>Aterr.</th>
            </tr></thead>
            <tbody>${filas}</tbody>
          </table>
        </div>
      </div>`;
  });

  // Títulos
  const instLabel = instFiltro === 'todos' ? 'Todos los instructores' : instFiltro;
  document.getElementById('rep-inst-titulo').textContent =
    `HORAS POR INSTRUCTOR — ${instLabel.toUpperCase()}`;
  document.getElementById('rep-inst-subtitulo').textContent =
    `Período: ${fmtDD(desde)} al ${fmtDD(hasta)}  ·  Generado: ${fmtDD(hoyStr)}  ·  Por: ${nombre}`;

  // Guardar datos procesados para exportación Excel
  _paramsInstructor = { desde, hasta, inst: instFiltro };
  _datosInstructor = [...filtrados].sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.hora||'').localeCompare(a.hora||'')).map(r => {
    const cls = clasificar(r);
    return {
      'Fecha': fmtDD(r.fecha),
      'Hora': r.hora || r.horaInicio || '',
      'Alumno/Piloto': r.nombre || '',
      'Avión': r.avion || 'LV-OAD',
      'Tipo de vuelo': (r.tipo_vuelo||'instruccion')==='particular'?'Particular':'Instrucción',
      'Estado': cls==='volado'?'Volado':'No volado',
      'Horas de vuelo': horasDe(r) || '',
      'Aterrizajes': aterrDe(r) || '',
      'Instructor': instDe(r),
    };
  });

  document.getElementById('spinner-inst').style.display  = 'none';
  document.getElementById('reporte-inst').style.display  = 'block';
  document.getElementById('btn-pdf-inst').style.display  = 'block';
  document.getElementById('btn-xls-inst').style.display  = 'block';

  document.getElementById('reporte-inst').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── EXPORTACIÓN EXCEL ─────────────────────────────────────────

// v1.6 — pedido de Daniel: el PDF (window.print()) imprimía las dos secciones
// (aeronaves + instructor) juntas si ambas habían sido generadas en la sesión,
// sin importar qué botón "⬇ PDF" se apretara. Marca <body> con una clase que
// el CSS @media print usa para ocultar la sección que no corresponde, imprime,
// y limpia la clase al volver (afterprint cubre cancelar el diálogo también).
window.imprimirPDF = function(seccion) {
  const cls = seccion === 'aviones' ? 'print-aviones' : (seccion === 'instructor' ? 'print-instructor' : 'print-alumno');
  document.body.classList.add(cls);
  const limpiar = () => { document.body.classList.remove(cls); window.removeEventListener('afterprint', limpiar); };
  window.addEventListener('afterprint', limpiar);
  window.print();
};

window.exportarExcelAeronaves = function() {
  if (!_datosAeronaves.length) return;
  const { desde, hasta, avion } = _paramsAeronaves;
  const wb = XLSX.utils.book_new();

  // Hoja principal: detalle de todos los vuelos
  const ws = XLSX.utils.json_to_sheet(_datosAeronaves);
  // Ancho de columnas estimado
  ws['!cols'] = [
    {wch:12},{wch:8},{wch:8},{wch:10},{wch:28},{wch:14},{wch:22},
    {wch:14},{wch:10},{wch:22},{wch:22},{wch:35},{wch:18}
  ];
  XLSX.utils.book_append_sheet(wb, ws, 'Detalle');

  // Hoja resumen: totales por avión
  const resumenRows = [];
  const aviones = avion === 'todos' ? ['LV-OAD','LV-ART','LV-MPH'] : [avion];
  aviones.forEach(av => {
    const rs = _datosAeronaves.filter(r => r['Avión'] === av);
    const volados = rs.filter(r => r['Estado'] === 'Volado');
    const horas = volados.reduce((s,r) => s + parseFloat(r['Horas de vuelo']||0), 0);
    const aterr = volados.reduce((s,r) => s + parseInt(r['Aterrizajes']||0), 0);
    resumenRows.push({
      'Aeronave': av,
      'Vuelos realizados': volados.length,
      'Horas de vuelo': horas ? Math.round(horas*100)/100 : '',
      'Aterrizajes': aterr || '',
      'No volados': rs.filter(r=>r['Estado']==='No volado').length,
      'Cancelados alumno': rs.filter(r=>r['Estado']==='Cancelado por alumno').length,
      'Cancelados instructor': rs.filter(r=>r['Estado']==='Cancelado por instructor').length,
      'Vencidos s/aprobar': rs.filter(r=>r['Estado']==='Vencido s/aprobar').length,
      'Activos/futuros': rs.filter(r=>['Aprobado','Pendiente'].includes(r['Estado'])).length,
      'Total registros': rs.length,
    });
  });
  const wsRes = XLSX.utils.json_to_sheet(resumenRows);
  wsRes['!cols'] = [{wch:12},{wch:18},{wch:14},{wch:12},{wch:14},{wch:18},{wch:20},{wch:18},{wch:16},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen por aeronave');

  const avLabel = avion === 'todos' ? 'Todas' : avion;
  XLSX.writeFile(wb, `Actividad_Aeronaves_${avLabel}_${desde}_${hasta}.xlsx`);
};

window.exportarExcelInstructor = function() {
  if (!_datosInstructor.length) return;
  const { desde, hasta, inst } = _paramsInstructor;
  const wb = XLSX.utils.book_new();

  // Hoja detalle
  const ws = XLSX.utils.json_to_sheet(_datosInstructor);
  ws['!cols'] = [{wch:12},{wch:8},{wch:28},{wch:10},{wch:14},{wch:14},{wch:14},{wch:10},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws, 'Detalle');

  // Hoja resumen: totales por instructor
  const porInst = {};
  _datosInstructor.forEach(r => {
    const i = r['Instructor'] || '(sin registrar)';
    if (!porInst[i]) porInst[i] = [];
    porInst[i].push(r);
  });
  const resumenRows = Object.entries(porInst)
    .map(([instNombre, rs]) => {
      const horas = rs.reduce((s,r) => s + parseFloat(r['Horas de vuelo']||0), 0);
      const aterr = rs.reduce((s,r) => s + parseInt(r['Aterrizajes']||0), 0);
      return {
        'Instructor': instNombre,
        'Vuelos volados': rs.filter(r=>r['Estado']==='Volado').length,
        'Horas de vuelo': horas ? Math.round(horas*100)/100 : '',
        'Aterrizajes': aterr || '',
        'No volados': rs.filter(r=>r['Estado']==='No volado').length,
        'Total turnos': rs.length,
      };
    })
    .sort((a,b) => (b['Horas de vuelo']||0) - (a['Horas de vuelo']||0));

  const wsRes = XLSX.utils.json_to_sheet(resumenRows);
  wsRes['!cols'] = [{wch:24},{wch:14},{wch:14},{wch:12},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen por instructor');

  const instLabel = inst === 'todos' ? 'Todos' : inst.replace(/ /g,'_');
  XLSX.writeFile(wb, `Horas_Instructor_${instLabel}_${desde}_${hasta}.xlsx`);
};

window.exportarExcelAlumno = function() {
  if (!_datosAlumno.length) return;
  const { desde, hasta, alumno } = _paramsAlumno;
  const wb = XLSX.utils.book_new();

  // Hoja detalle
  const ws = XLSX.utils.json_to_sheet(_datosAlumno);
  ws['!cols'] = [{wch:12},{wch:8},{wch:28},{wch:10},{wch:10},{wch:14},{wch:14},{wch:14},{wch:10},{wch:22}];
  XLSX.utils.book_append_sheet(wb, ws, 'Detalle');

  // Hoja resumen: totales por alumno/piloto
  const porAlu = {};
  _datosAlumno.forEach(r => {
    const k = r['Alumno/Piloto'] || '(sin registrar)';
    if (!porAlu[k]) porAlu[k] = [];
    porAlu[k].push(r);
  });
  const resumenRows = Object.entries(porAlu)
    .map(([aluNombre, rs]) => {
      const horas = rs.reduce((s,r) => s + parseFloat(r['Horas de vuelo']||0), 0);
      const aterr = rs.reduce((s,r) => s + parseInt(r['Aterrizajes']||0), 0);
      return {
        'Alumno/Piloto': aluNombre,
        'Rol': rs[0]['Rol'] || '',
        'Vuelos volados': rs.filter(r=>r['Estado']==='Volado').length,
        'Horas de vuelo': horas ? Math.round(horas*100)/100 : '',
        'Aterrizajes': aterr || '',
        'No volados': rs.filter(r=>r['Estado']==='No volado').length,
        'Total turnos': rs.length,
      };
    })
    .sort((a,b) => (b['Horas de vuelo']||0) - (a['Horas de vuelo']||0));

  const wsRes = XLSX.utils.json_to_sheet(resumenRows);
  wsRes['!cols'] = [{wch:26},{wch:10},{wch:14},{wch:14},{wch:12},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen por alumno-piloto');

  const aluLabel = alumno === 'todos' ? 'Todos' : (_datosAlumno[0]?.['Alumno/Piloto']||alumno).replace(/ /g,'_');
  XLSX.writeFile(wb, `Horas_Alumno_${aluLabel}_${desde}_${hasta}.xlsx`);
};
