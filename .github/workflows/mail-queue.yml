name: Mail queue sender

on:
  schedule:
    # Cada 15 minutos, mismo intervalo que los otros crons del club.
    - cron: "*/15 * * * *"
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions
    inputs:
      dry_run:
        description: "Probar sin enviar ni tocar Firebase (1 = sí, 0 = no)"
        default: "1"

jobs:
  mail_queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drenar cola de mails (confirmación/liberación de turno)
        env:
          # ── Públicos (no secretos): editá si hace falta ──────────────
          FIREBASE_DB_URL: "https://turnos-lv-oad-default-rtdb.firebaseio.com"
          # Cuenta A (servicio "Admin Aeroclub", Gmail aeroclubgra@gmail.com) —
          # la misma que usaba turnos.html desde el navegador para estos dos
          # templates. Ahora los manda este cron, no el browser del instructor.
          EMAILJS_SERVICE_ID: "service_8yqlptz"
          EMAILJS_PUBLIC_KEY: "0IoRm88tZQepkHAdK"
          EMAILJS_TEMPLATE_CONFIRMA: "template_4nsseoo"
          EMAILJS_TEMPLATE_LIBERA: "template_41kdlo3"
          EMAILJS_TEMPLATE_CANCELA: "template_v4qu4x6"
          MAX_INTENTOS: "8"
          # ── Secreto: Cuenta A tiene su PROPIA private key, distinta de la
          # que ya usan vencimiento-turnos.yml/recordatorio-instructor.yml
          # (esa es de Cuenta B). Cargar en Settings > Secrets and variables
          # > Actions con el nombre EMAILJS_PRIVATE_KEY_A ──────────────────
          EMAILJS_PRIVATE_KEY_A: ${{ secrets.EMAILJS_PRIVATE_KEY_A }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python mail_queue_sender.py
